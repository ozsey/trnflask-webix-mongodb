steps:
- name: gcr.io/cloud-builders/docker
  args: ['build', '-t', 'asia-southeast2-docker.pkg.dev/training-python-internal-2020/training-python/hose:v.0.1', '.']
- name: 'gcr.io/cloud-builders/docker'
  args: ["push", "asia-southeast2-docker.pkg.dev/training-python-internal-2020/training-python/hose:v.0.1"]
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - 'run'
  - 'deploy'
  - 'hose'
  - '--image'
  - 'asia-southeast2-docker.pkg.dev/training-python-internal-2020/training-python/hose:v.0.1'
  - '--region'
  - 'asia-southeast2'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'